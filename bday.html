<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<style>
:root{
  --bg1:#dff0ff; --bg2:#8ec5ff; --bg3:#2f6fd6;
  --card:rgba(255,255,255,.78); --text:#10306b; --accent:#1f5fd0; --border:rgba(255,255,255,.9);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#0b1d44; --bg2:#12386f; --bg3:#1c5bb8;
    --card:rgba(15,35,80,.72); --text:#e6f1ff; --accent:#8ec5ff; --border:rgba(142,197,255,.35);
  }
}
:root[data-theme="dark"]{
  --bg1:#0b1d44; --bg2:#12386f; --bg3:#1c5bb8;
  --card:rgba(15,35,80,.72); --text:#e6f1ff; --accent:#8ec5ff; --border:rgba(142,197,255,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:'Georgia','Times New Roman',serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed; overflow-x:hidden;
}
#butterflies{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
main{
  position:relative; z-index:1; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:40px 20px; text-align:center;
}
h1{
  font-family:'Brush Script MT','Segoe Script','Snell Roundhand',cursive;
  font-size:clamp(2.8rem,10vw,5.5rem); margin:0 0 24px; color:var(--accent);
  text-shadow:0 2px 12px rgba(255,255,255,.4); font-weight:400;
}
.card{
  width:min(640px,100%); background:var(--card); border:2px solid var(--border);
  border-radius:24px; padding:28px; backdrop-filter:blur(8px);
  box-shadow:0 12px 40px rgba(20,60,140,.25);
}
#message{
  min-height:220px; outline:none; font-size:1.25rem; line-height:1.7;
  text-align:center; white-space:pre-wrap; word-break:break-word;
}
</style>
</head>
<body>
<svg id="butterflies" aria-hidden="true"></svg>

<main>
  <h1 id="title">Happy Birthday!</h1>
  <div class="card">
    <div id="message"></div>
  </div>
</main>

<script>
/* ============================================================
   ✏️  WRITE YOUR MESSAGE HERE  (between the backticks)
   Line breaks are kept exactly as you type them.
   ============================================================ */
var TITLE   = "Happy Birthday!";
var MESSAGE = ` Happy birthday Tara, I'm so glad you came into my life this year and you deserve all the happiness in the world.
I'll do mybest t always keep a smile on your face and I hope you have a wonderful day and an amazing year ahead. Happy birthday again, my love


`;
/* ============================================================ */

document.getElementById('title').textContent = TITLE;
document.getElementById('message').textContent = MESSAGE.trim();

(function(){
  var svg=document.getElementById('butterflies');
  var NS='http://www.w3.org/2000/svg';
  var colors=['#4da3ff','#1f6feb','#9fd0ff','#6fb7ff','#2a54c9','#bfe0ff'];
  var count=Math.min(16,Math.max(8,Math.floor(window.innerWidth/90)));
  var items=[];

  function wing(d,fill){
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('fill',fill);
    p.setAttribute('stroke','rgba(255,255,255,.8)'); p.setAttribute('stroke-width','1.5');
    return p;
  }

  function make(){
    var c=colors[Math.floor(Math.random()*colors.length)];
    var g=document.createElementNS(NS,'g');
    var left=document.createElementNS(NS,'g');
    var right=document.createElementNS(NS,'g');
    var wl='M0,0 C-10,-30 -45,-35 -42,-8 C-40,8 -20,12 0,2 Z M0,2 C-8,14 -28,32 -18,34 C-8,36 0,22 0,2 Z';
    left.appendChild(wing(wl,c));
    right.appendChild(wing(wl,c));
    right.setAttribute('transform','scale(-1,1)');
    var dotL=document.createElementNS(NS,'circle');
    dotL.setAttribute('cx',-28);dotL.setAttribute('cy',-14);dotL.setAttribute('r',5);dotL.setAttribute('fill','rgba(255,255,255,.65)');
    left.appendChild(dotL);
    var dotR=dotL.cloneNode();right.appendChild(dotR);
    var body=document.createElementNS(NS,'ellipse');
    body.setAttribute('rx',2.5);body.setAttribute('ry',14);body.setAttribute('cy',4);body.setAttribute('fill','#0e2a63');
    var a1=document.createElementNS(NS,'path');
    a1.setAttribute('d','M0,-9 Q-6,-22 -10,-24 M0,-9 Q6,-22 10,-24');
    a1.setAttribute('stroke','#0e2a63');a1.setAttribute('fill','none');a1.setAttribute('stroke-width','1.2');
    var inner=document.createElementNS(NS,'g');
    inner.appendChild(left);inner.appendChild(right);
    g.appendChild(inner);g.appendChild(body);g.appendChild(a1);
    svg.appendChild(g);
    var s=0.5+Math.random()*0.9;
    return {g:g,wings:inner,
      x:Math.random()*innerWidth,y:Math.random()*innerHeight,
      s:s,vx:(Math.random()-.5)*0.8,vy:-0.3-Math.random()*0.6,
      t:Math.random()*100,flap:0.15+Math.random()*0.1,
      op:0.35+Math.random()*0.45};
  }

  for(var i=0;i<count;i++)items.push(make());

  function tick(){
    var W=innerWidth,H=innerHeight;
    items.forEach(function(b){
      b.t+=1;
      b.x+=b.vx+Math.sin(b.t/40)*0.9;
      b.y+=b.vy+Math.cos(b.t/55)*0.3;
      if(b.y<-60){b.y=H+60;b.x=Math.random()*W}
      if(b.x<-60)b.x=W+60;
      if(b.x>W+60)b.x=-60;
      var f=Math.abs(Math.sin(b.t*b.flap));
      var rot=Math.sin(b.t/40)*15;
      b.g.setAttribute('transform','translate('+b.x+','+b.y+') rotate('+rot+') scale('+b.s+')');
      b.wings.setAttribute('transform','scale('+(0.25+0.75*f)+',1)');
      b.g.setAttribute('opacity',b.op);
    });
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
